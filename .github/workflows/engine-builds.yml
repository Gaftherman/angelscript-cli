name: Engine builds

# Builds the CLI against the official AngelScript releases it supports, on every target, and attaches the
# results to a published release. This workflow never blocks CI or a release: the base assets are already out
# when it runs, and a failed engine job only leaves that build out.
# Run it by hand for an existing release with: Actions > Engine builds > Run workflow > tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (empty builds without publishing)
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - cmake/**
      - scripts/build-engine.py
      - scripts/package*
      - external/angelscript-engine
      - .github/workflows/engine-builds.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - scripts/build-engine.py
      - external/angelscript-engine
      - .github/workflows/engine-builds.yml

permissions:
  contents: read

jobs:
  engines:
    name: Engine ${{ matrix.engine }} (${{ matrix.target.os }} ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: ['2.38.0', '2.37.0', '2.36.1', '2.35.1', '2.33.0', '2.30.2']
        target:
          - {runner: windows-latest, os: windows, arch: x64, msvc: x64, toolchain: ''}
          - {runner: windows-latest, os: windows, arch: x86, msvc: amd64_x86, toolchain: ''}
          - {runner: ubuntu-24.04, os: linux, arch: x64, msvc: x64, toolchain: ''}
          - {runner: ubuntu-24.04, os: linux, arch: x86, msvc: x64, toolchain: cmake/linux-x86.cmake}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, msvc: x64, toolchain: ''}
          - {runner: macos-15, os: macos, arch: arm64, msvc: x64, toolchain: ''}
          - {runner: macos-15-intel, os: macos, arch: x64, msvc: x64, toolchain: ''}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target.msvc }}
      - name: Install 32-bit toolchain
        if: matrix.target.os == 'linux' && matrix.target.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Build against the official release
        shell: pwsh
        env:
          TOOLCHAIN: ${{ matrix.target.toolchain }}
        run: |
          if ($env:TOOLCHAIN) { $env:CMAKE_TOOLCHAIN_FILE = Join-Path $PWD $env:TOOLCHAIN }
          python -m pip install ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build-engine.py ${{ matrix.engine }} --prefix build/engine/out --work build/engine
      - name: Smoke test the built engine
        shell: pwsh
        run: |
          $binary = "build/engine/build/${{ matrix.engine }}/bin/angelscript"
          if (Test-Path "$binary.exe") { $binary = "$binary.exe" }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in 'hello', 'sum', 'strings') {
              & $binary "examples/$script.as"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(angelscript-cli VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          cmake "-DBUILD_DIR=build/engine/build/${{ matrix.engine }}" "-DCONFIG=Release" "-DVERSION=$version" "-DOS=${{ matrix.target.os }}" "-DARCH=${{ matrix.target.arch }}" "-DENGINE=${{ matrix.engine }}" -P scripts/package.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: angelscript-cli-engine-${{ matrix.engine }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: |
            dist/*-as${{ matrix.engine }}-*
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  setup-with-engines:
    name: Windows ${{ matrix.arch }} setup with engine builds
    needs: engines
    if: ${{ !cancelled() && (github.event.release.tag_name || inputs.tag) }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: angelscript-cli-engine-*-windows-${{ matrix.arch }}
          path: parts
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build and test the setup program with the engine builds
        shell: pwsh
        run: |
          gh release download $env:TAG --repo "${{ github.repository }}" --pattern 'angelscript-cli-*-windows-${{ matrix.arch }}.zip' --dir base
          $zip = Get-ChildItem base -Filter 'angelscript-cli-*-windows-${{ matrix.arch }}.zip' | Select-Object -First 1
          $version = [regex]::Match($zip.Name, '^angelscript-cli-([0-9.]+)-windows-${{ matrix.arch }}\.zip$').Groups[1].Value
          Expand-Archive $zip.FullName -DestinationPath main
          New-Item -ItemType Directory -Force engines | Out-Null
          foreach ($archive in Get-ChildItem parts -Recurse -Filter 'angelscript-cli-*-as*-windows-${{ matrix.arch }}.zip') {
              $engine = [regex]::Match($archive.Name, '-as([0-9.]+)-windows-${{ matrix.arch }}').Groups[1].Value
              $folder = "unpack-$engine"
              Expand-Archive $archive.FullName -DestinationPath $folder
              Copy-Item "$folder/angelscript.exe" "engines/angelscript-$engine.exe"
          }
          ./scripts/package-installer.ps1 -Binary main/angelscript.exe -Version $version -EngineDir engines -Arch ${{ matrix.arch }}
          ./scripts/test-installer.ps1 -Setup "dist/angelscript-cli-$version-windows-${{ matrix.arch }}-setup.exe" -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: angelscript-cli-setup-windows-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Attach the builds to the release
    needs: [engines, setup-with-engines]
    if: ${{ !cancelled() && (github.event.release.tag_name || inputs.tag) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: angelscript-cli-engine-*
          path: art
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: angelscript-cli-setup-windows-*
          path: art
          merge-multiple: true
      - name: Upload and update SHA256SUMS
        run: |
          set -eu
          cd art
          rm -f SHA256SUMS
          ls
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHA256SUMS --dir old
          # The setup programs with the engine components replace the plain ones of the same name.
          names=$(ls | grep -E '^angelscript-cli-' || true)
          test -n "$names" || { echo "No engine builds to attach"; exit 0; }
          { grep -v -F -f <(for n in $names; do echo "  $n"; done) old/SHA256SUMS || true; sha256sum $names; } | sort -k2 > SHA256SUMS
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber $names SHA256SUMS
