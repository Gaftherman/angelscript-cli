name: Release

# The release is created when CI succeeds on main and the version in CMakeLists.txt has no release yet.
# Bump the version and add its CHANGELOG section in the same change to publish a new one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Decide whether this version needs a release
        id: version
        run: |
          version=$(sed -n 's/^project(angelscript-cli VERSION \([0-9][0-9]*[.][0-9][0-9]*[.][0-9][0-9]*\) .*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
              echo "Could not read the version from CMakeLists.txt" >&2
              exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; nothing to publish."
              echo "release=false" >> "$GITHUB_OUTPUT"
          else
              echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          pattern: angelscript-cli-*
          path: release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Assemble release files and changelog
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil

          version = os.environ["VERSION"]
          release = Path("release")
          release.mkdir()
          expected_platforms = {
              "windows-x64": ["zip", "setup.exe"],
              "linux-x64": ["tar.gz", "deb"],
              "linux-arm64": ["tar.gz", "deb"],
              "macos-x64": ["tar.gz", "pkg"],
              "macos-arm64": ["tar.gz", "pkg"],
          }
          sums = []
          for platform, extensions in expected_platforms.items():
              artifact = Path("release-artifacts") / f"angelscript-cli-{platform}"
              expected = []
              for extension in extensions:
                  if extension == "setup.exe":
                      asset_name = f"angelscript-cli-{version}-{platform}-setup.exe"
                  else:
                      asset_name = f"angelscript-cli-{version}-{platform}.{extension}"
                  asset = artifact / asset_name
                  with asset.open("rb") as archive:
                      digest = hashlib.file_digest(archive, "sha256").hexdigest()
                  expected.append(f"{digest}  {asset_name}")
                  shutil.copyfile(asset, release / asset_name)
              manifest = (artifact / "SHA256SUMS").read_text(encoding="ascii").splitlines()
              if sorted(manifest) != sorted(expected):
                  raise SystemExit(f"Invalid SHA256SUMS for {platform}")
              sums.extend(expected)
          (release / "SHA256SUMS").write_text("\n".join(sorted(sums)) + "\n", encoding="ascii")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(rf"^## \[{re.escape(version)}\](?:[ \t]+-[^\n]*)?[ \t]*$", changelog, re.M)
          if not heading:
              raise SystemExit(f"No changelog section for {version}")
          body = re.split(r"^(?:## |\[[^\]]+\]:)", changelog[heading.end():], maxsplit=1, flags=re.M)[0].strip()
          if not body:
              raise SystemExit(f"Empty changelog section for {version}")
          Path("release-body.md").write_text(body + "\n", encoding="utf-8")
          PY
      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/angelscript-cli-* release/SHA256SUMS \
            --target "$SOURCE_SHA" --title "$TAG" --notes-file release-body.md
